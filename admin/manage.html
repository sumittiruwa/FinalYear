```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Pharmacy</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .pharmacy-info {
            padding: 20px;
            background: #f1f1f1;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #333;
        }

        .medicine-form {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .inventory {
            margin-top: 30px;
        }

        .medicine-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .medicine-card h3 {
            margin-top: 0;
        }

        .medicine-card p {
            margin: 7px 0;
        }

        .back {
            background: #555;
            margin-bottom: 20px;
        }

    </style>

</head>


<body>


<div class="container">


    <button
        class="back"
        onclick="goBack()"
    >
        ← Back to Pharmacies
    </button>


    <h1>Manage Pharmacy</h1>


    <!-- PHARMACY DETAILS -->

    <div
        id="pharmacyInfo"
        class="pharmacy-info"
    >

        Loading pharmacy...

    </div>


    <!-- ADD MEDICINE -->

    <div class="medicine-form">

        <h2>Add Medicine</h2>


        <div class="form-group">

            <label>Medicine Name</label>

            <input
                type="text"
                id="medicineName"
                placeholder="e.g. Paracetamol 500mg"
            >

        </div>


        <div class="form-group">

            <label>Generic Name</label>

            <input
                type="text"
                id="genericName"
                placeholder="e.g. Paracetamol"
            >

        </div>


        <div class="form-group">

            <label>Category</label>

            <input
                type="text"
                id="medicineCategory"
                placeholder="e.g. Pain Relief"
            >

        </div>


        <div class="form-group">

            <label>Price</label>

            <input
                type="number"
                id="price"
                placeholder="Enter price"
            >

        </div>


        <div class="form-group">

            <label>Stock Quantity</label>

            <input
                type="number"
                id="stock"
                placeholder="Enter stock quantity"
                min="0"
            >

        </div>


        <button onclick="addMedicine()">

            Add Medicine

        </button>

    </div>


    <!-- INVENTORY -->

    <div class="inventory">

        <h2>Medicine Inventory</h2>


        <div id="medicineList">

            Loading medicines...

        </div>

    </div>


</div>


<script>


const API_URL = "http://127.0.0.1:8000";


// Get pharmacy ID from URL

const params =
    new URLSearchParams(
        window.location.search
    );


const pharmacyId =
    params.get("id");


// Check ID

if (!pharmacyId) {

    alert("Pharmacy ID is missing.");

}


// =====================================
// LOAD PHARMACY
// =====================================

async function loadPharmacy() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/shops/${pharmacyId}`
            );


        if (!response.ok) {

            throw new Error(
                "Pharmacy not found"
            );

        }


        const pharmacy =
            await response.json();


        document.getElementById(
            "pharmacyInfo"
        ).innerHTML = `

            <h2>🏥 ${pharmacy.name}</h2>

            <p>
                <strong>Owner:</strong>
                ${pharmacy.owner || "N/A"}
            </p>

            <p>
                <strong>Category:</strong>
                ${pharmacy.category || "Pharmacy"}
            </p>

            <p>
                <strong>Phone:</strong>
                ${pharmacy.phone || "N/A"}
            </p>

            <p>
                <strong>Address:</strong>
                ${pharmacy.address || "N/A"}
            </p>

        `;

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "pharmacyInfo"
        ).innerHTML = `
            <p>
                Could not load pharmacy.
            </p>
        `;

    }

}


// =====================================
// ADD MEDICINE
// =====================================

async function addMedicine() {


    const medicine = {

        pharmacy_id:
            Number(pharmacyId),

        name:
            document.getElementById(
                "medicineName"
            ).value,

        generic_name:
            document.getElementById(
                "genericName"
            ).value,

        category:
            document.getElementById(
                "medicineCategory"
            ).value,

        price:
            Number(
                document.getElementById(
                    "price"
                ).value
            ),

        quantity:
            Number(
                document.getElementById(
                    "stock"
                ).value
            )

    };


    if (!medicine.name) {

        alert(
            "Please enter medicine name."
        );

        return;

    }


    if (medicine.quantity < 0) {

        alert(
            "Stock cannot be negative."
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/medicines`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            medicine
                        )

                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(error);

            throw new Error(
                "Failed to add medicine"
            );

        }


        await response.json();


        alert(
            "Medicine added successfully!"
        );


        // Clear form

        document.getElementById(
            "medicineName"
        ).value = "";

        document.getElementById(
            "genericName"
        ).value = "";

        document.getElementById(
            "medicineCategory"
        ).value = "";

        document.getElementById(
            "price"
        ).value = "";

        document.getElementById(
            "stock"
        ).value = "";


        // Reload inventory

        loadMedicines();

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not add medicine."
        );

    }

}


// =====================================
// LOAD INVENTORY
// =====================================

async function loadMedicines() {


    const list =
        document.getElementById(
            "medicineList"
        );


    try {

        const response =
            await fetch(
                `${API_URL}/api/medicines/pharmacy/${pharmacyId}`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load medicines"
            );

        }


        const medicines =
            await response.json();


        list.innerHTML = "";


        if (
            !medicines ||
            medicines.length === 0
        ) {

            list.innerHTML = `
                <p>
                    No medicines added yet.
                </p>
            `;

            return;

        }


        medicines.forEach(
            function(medicine) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "medicine-card";


                card.innerHTML = `

                    <h3>
                        💊 ${medicine.name}
                    </h3>

                    <p>
                        <strong>
                            Generic Name:
                        </strong>

                        ${medicine.generic_name || "N/A"}
                    </p>

                    <p>
                        <strong>
                            Category:
                        </strong>

                        ${medicine.category || "N/A"}
                    </p>

                    <p>
                        <strong>
                            Price:
                        </strong>

                        Rs. ${medicine.price}
                    </p>

                    <p>
                        <strong>
                            Stock:
                        </strong>

                        ${medicine.quantity}
                    </p>

                    <p>
                        <strong>
                            Status:
                        </strong>

                        ${
                            medicine.quantity > 0
                            ? "Available"
                            : "Out of Stock"
                        }
                    </p>

                `;


                list.appendChild(card);

            }
        );

    }

    catch (error) {

        console.error(error);

        list.innerHTML = `
            <p>
                Could not load medicine inventory.
            </p>
        `;

    }

}


// =====================================
// BACK
// =====================================

function goBack() {

    window.location.href =
        "/pharmacy";

}


// =====================================
// INITIAL LOAD
// =====================================

loadPharmacy();

loadMedicines();


</script>


</body>

</html>
```
